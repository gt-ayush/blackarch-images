name: Auto-Sync BlackArch Images

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: blackarch-image-release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/gt-ayush/blackarch

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
      raw_version: ${{ steps.check.outputs.raw_version }}
      is_new_iso: ${{ steps.check.outputs.is_new_iso }}
      should_build: ${{ steps.check.outputs.should_build }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check BlackArch ISO version and build schedule
        id: check
        run: |
          set -euo pipefail

          LATEST_ISO=$(
            curl -fsSL -A "Mozilla/5.0" https://blackarch.org |
              grep -oE 'blackarch-linux-full-[0-9]{4}\.[0-9]{2}\.[0-9]{2}' |
              head -n 1 |
              grep -oE '[0-9]{4}\.[0-9]{2}\.[0-9]{2}' ||
              true
          )

          if [ -z "$LATEST_ISO" ]; then
            echo "::error::Could not detect the latest BlackArch ISO version."
            exit 1
          fi

          VERSION="v${LATEST_ISO}"
          DAY_OF_WEEK=$(date -u +%u)

          echo "Detected BlackArch version: ${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "raw_version=${LATEST_ISO}" >> "$GITHUB_OUTPUT"

          if git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" >/dev/null 2>&1; then
            echo "is_new_iso=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_new_iso=true" >> "$GITHUB_OUTPUT"
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] ||
             [ "$DAY_OF_WEEK" = "7" ] ||
             [ "$(git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" >/dev/null 2>&1; echo $?)" -ne 0 ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" |
            docker login ghcr.io \
              --username "${{ github.actor }}" \
              --password-stdin

      - name: Build and push ${{ matrix.arch }} images
        env:
          VERSION: ${{ needs.check.outputs.version }}
          IS_NEW_ISO: ${{ needs.check.outputs.is_new_iso }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail

          for variant in standard devel distroless; do
            echo "Building ${variant} for linux/${ARCH}"

            docker buildx build \
              --platform "linux/${ARCH}" \
              --push \
              --file "./${variant}/Containerfile" \
              --tag "${IMAGE}:${variant}-${ARCH}" \
              "./${variant}"

            if [ "$IS_NEW_ISO" = "true" ]; then
              docker buildx imagetools create \
                --tag "${IMAGE}:${variant}-${VERSION}-${ARCH}" \
                "${IMAGE}:${variant}-${ARCH}"
            fi
          done

  publish:
    needs: [check, build]
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-24.04

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" |
            docker login ghcr.io \
              --username "${{ github.actor }}" \
              --password-stdin

      - name: Publish multi-architecture tags
        env:
          VERSION: ${{ needs.check.outputs.version }}
          IS_NEW_ISO: ${{ needs.check.outputs.is_new_iso }}
        run: |
          set -euo pipefail

          for variant in standard devel distroless; do
            echo "Publishing multi-architecture tag for ${variant}"

            docker buildx imagetools create \
              --tag "${IMAGE}:${variant}" \
              "${IMAGE}:${variant}-amd64" \
              "${IMAGE}:${variant}-arm64"

            if [ "$IS_NEW_ISO" = "true" ]; then
              docker buildx imagetools create \
                --tag "${IMAGE}:${variant}-${VERSION}" \
                "${IMAGE}:${variant}-${VERSION}-amd64" \
                "${IMAGE}:${variant}-${VERSION}-arm64"
            fi
          done

          # Keep :latest and :vYYYY.MM.DD as aliases for Standard.
          docker buildx imagetools create \
            --tag "${IMAGE}:latest" \
            "${IMAGE}:standard-amd64" \
            "${IMAGE}:standard-arm64"

          if [ "$IS_NEW_ISO" = "true" ]; then
            docker buildx imagetools create \
              --tag "${IMAGE}:${VERSION}" \
              "${IMAGE}:standard-${VERSION}-amd64" \
              "${IMAGE}:standard-${VERSION}-arm64"
          fi

      - name: Record built BlackArch version with a Git tag
        if: needs.check.outputs.is_new_iso == 'true'
        env:
          VERSION: ${{ needs.check.outputs.version }}
          RAW_VERSION: ${{ needs.check.outputs.raw_version }}
        run: |
          set -euo pipefail

          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --force --tags origin

          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "Tag ${VERSION} already exists."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${VERSION}" -m "BlackArch ${RAW_VERSION}"
            git push origin "refs/tags/${VERSION}"
          fi