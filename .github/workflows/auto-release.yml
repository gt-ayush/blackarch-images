name: Auto-Sync BlackArch Images

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/gt-ayush/blackarch

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Determine version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(date -u +%Y.%m.%d)"
          TAG="v${VERSION}"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push standard, devel, distroless images
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          for variant in standard devel distroless; do
            echo "== Building ${variant} =="
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --push \
              -f "./${variant}/Containerfile" \
              -t "${IMAGE}:${variant}" \
              -t "${IMAGE}:${variant}-${VERSION}" \
              "./${variant}"
          done

          docker buildx imagetools create \
            --tag "${IMAGE}:latest" \
            "${IMAGE}:standard"

          docker buildx imagetools create \
            --tag "${IMAGE}:${TAG}" \
            "${IMAGE}:standard-${VERSION}"

      - name: Create git tag for the date version
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          TAG="${{ steps.version.outputs.tag }}"

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists."
          else
            git tag -a "${TAG}" -m "BlackArch image sync ${TAG}"
            git push origin "refs/tags/${TAG}"
          fi