name: Auto-Sync BlackArch Release

on:
  schedule:
    # Runs daily at 02:00 UTC (7:30 AM IST)
    # - Checks for new BlackArch ISO releases every day
    # - Automatically refreshes rolling :latest tags every Sunday (day 0)
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows manual trigger button on GitHub anytime

permissions:
  contents: write
  packages: write

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check BlackArch ISO version and schedule day
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_ISO=$(curl -sL https://blackarch.org | grep -oE 'blackarch-linux-full-[0-9]{4}\.[0-9]{2}\.[0-9]{2}' | head -n 1 | grep -oE '[0-9]{4}\.[0-9]{2}\.[0-9]{2}')
          VERSION="v${LATEST_ISO}"
          DAY_OF_WEEK=$(date -u +%u) # 7 = Sunday

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "raw_version=${LATEST_ISO}" >> $GITHUB_OUTPUT

          if gh release view "${VERSION}" >/dev/null 2>&1; then
            echo "is_new_iso=false" >> $GITHUB_OUTPUT
          else
            echo "is_new_iso=true" >> $GITHUB_OUTPUT
          fi

          # Build if: new ISO detected OR today is Sunday OR manually triggered
          if ! gh release view "${VERSION}" >/dev/null 2>&1 || [ "$DAY_OF_WEEK" == "7" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
          else
            echo "should_build=false" >> $GITHUB_OUTPUT
          fi

      - name: Log in to GitHub Container Registry (ghcr.io)
        if: steps.check.outputs.should_build == 'true'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push rolling tags to ghcr.io
        if: steps.check.outputs.should_build == 'true'
        run: |
          IMAGE="ghcr.io/gt-ayush/blackarch"
          VERSION="${{ steps.check.outputs.version }}"
          IS_NEW_ISO="${{ steps.check.outputs.is_new_iso }}"
          mkdir -p release-assets

          for variant in standard devel distroless; do
            echo "=== Building ${variant} ==="
            podman build --no-cache -t "${IMAGE}:${variant}" "./${variant}"
            podman push "${IMAGE}:${variant}"

            # If this is a new ISO release, also tag with the ISO version and export tarball
            if [ "$IS_NEW_ISO" == "true" ]; then
              podman tag "${IMAGE}:${variant}" "${IMAGE}:${variant}-${VERSION}"
              podman push "${IMAGE}:${variant}-${VERSION}"
              podman save "${IMAGE}:${variant}-${VERSION}" | gzip > "release-assets/blackarch-${variant}-${VERSION}.tar.gz"
            fi
          done

          # Always update :latest tag on ghcr.io
          podman tag "${IMAGE}:standard" "${IMAGE}:latest"
          podman push "${IMAGE}:latest"

          # Tag :vYYYY.MM.DD on ghcr.io if new ISO
          if [ "$IS_NEW_ISO" == "true" ]; then
            podman tag "${IMAGE}:standard" "${IMAGE}:${VERSION}"
            podman push "${IMAGE}:${VERSION}"
          fi

      - name: Publish GitHub Release (Only when a new ISO drops)
        if: steps.check.outputs.is_new_iso == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.check.outputs.version }}" release-assets/*.tar.gz \
            --title "BlackArch ${{ steps.check.outputs.version }}" \
            --notes "Automated build synced with official BlackArch ISO **${{ steps.check.outputs.raw_version }}**. Pull via \`ghcr.io/gt-ayush/blackarch\` or download the offline \`.tar.gz\` archives below."
