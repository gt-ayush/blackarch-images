name: Auto-Sync BlackArch Release

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check BlackArch ISO version and schedule day
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_ISO=$(curl -sLA "Mozilla/5.0" https://blackarch.org | grep -oE 'blackarch-linux-full-[0-9]{4}\.[0-9]{2}\.[0-9]{2}' | head -n 1 | grep -oE '[0-9]{4}\.[0-9]{2}\.[0-9]{2}' || true)
          
          if [ -z "$LATEST_ISO" ]; then
            LATEST_ISO=$(date -u +%Y.%m.%d)
          fi

          VERSION="v${LATEST_ISO}"
          DAY_OF_WEEK=$(date -u +%u)

          echo "Detected version: ${VERSION}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "raw_version=${LATEST_ISO}" >> $GITHUB_OUTPUT

          if gh release view "${VERSION}" >/dev/null 2>&1; then
            echo "is_new_iso=false" >> $GITHUB_OUTPUT
          else
            echo "is_new_iso=true" >> $GITHUB_OUTPUT
          fi

          if ! gh release view "${VERSION}" >/dev/null 2>&1 || [ "$DAY_OF_WEEK" == "7" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
          else
            echo "should_build=false" >> $GITHUB_OUTPUT
          fi

      - name: Log in to GitHub Container Registry (ghcr.io)
        if: steps.check.outputs.should_build == 'true'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push rolling tags to ghcr.io
        if: steps.check.outputs.should_build == 'true'
        run: |
          IMAGE="ghcr.io/gt-ayush/blackarch"
          VERSION="${{ steps.check.outputs.version }}"
          IS_NEW_ISO="${{ steps.check.outputs.is_new_iso }}"
          mkdir -p release-assets

          for variant in standard devel distroless; do
            echo "=== Building ${variant} ==="
            docker build --no-cache -t "${IMAGE}:${variant}" "./${variant}"
            docker push "${IMAGE}:${variant}"

            if [ "$IS_NEW_ISO" == "true" ]; then
              docker tag "${IMAGE}:${variant}" "${IMAGE}:${variant}-${VERSION}"
              docker push "${IMAGE}:${variant}-${VERSION}"
              docker save "${IMAGE}:${variant}-${VERSION}" | gzip > "release-assets/blackarch-${variant}-${VERSION}.tar.gz"
            fi
          done

          docker tag "${IMAGE}:standard" "${IMAGE}:latest"
          docker push "${IMAGE}:latest"

          if [ "$IS_NEW_ISO" == "true" ]; then
            docker tag "${IMAGE}:standard" "${IMAGE}:${VERSION}"
            docker push "${IMAGE}:${VERSION}"
          fi

      - name: Commit version tag under your username and publish GitHub Release
        if: steps.check.outputs.is_new_iso == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.check.outputs.version }}"
          RAW_VERSION="${{ steps.check.outputs.raw_version }}"

          git config user.name "gt-ayush"
          git config user.email "gt-ayush@://github.com"

          git commit --allow-empty -m "release: sync BlackArch ${VERSION}"
          git tag -a "${VERSION}" -m "BlackArch ${VERSION}"
          git push origin main --tags

          gh release create "${VERSION}" release-assets/*.tar.gz \
            --target "${VERSION}" \
            --title "BlackArch ${VERSION}" \
            --notes "Automated build synced with official BlackArch ISO **${RAW_VERSION}**. Pull via \`ghcr.io/gt-ayush/blackarch\` or download the offline \`.tar.gz\` archives below."
