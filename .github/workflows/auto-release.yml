name: Auto-Sync BlackArch Images

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: blackarch-release
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

env:
  IMAGE: ghcr.io/gt-ayush/blackarch

jobs:
  build:
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            base_image: docker.io/library/archlinux:latest
            runner: ubuntu-24.04
          - arch: arm64
            base_image: ghcr.io/baerenbude-org/archlinuxarm-arm64v8:latest
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build variant images
        env:
          BASE_IMAGE: ${{ matrix.base_image }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail

          for variant in standard devel distroless; do
            docker buildx build \
              --pull \
              --platform "linux/${ARCH}" \
              --build-arg "BASE_IMAGE=${BASE_IMAGE}" \
              --build-arg "BUILDARCH=${ARCH}" \
              --provenance=true \
              --sbom=true \
              --push \
              --cache-from "type=gha,scope=${variant}-${ARCH}" \
              --cache-to "type=gha,mode=max,scope=${variant}-${ARCH}" \
              -f "./${variant}/Containerfile" \
              -t "${IMAGE}:${variant}-${ARCH}" \
              "./${variant}"
          done

      - name: Smoke test shell variants
        if: matrix.arch == 'amd64'
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          docker pull --platform "linux/${ARCH}" "${IMAGE}:standard-${ARCH}"
          docker run --rm --platform "linux/${ARCH}" "${IMAGE}:standard-${ARCH}" \
            /bin/bash -lc 'test -x /bin/bash && pacman --version'
          docker pull --platform "linux/${ARCH}" "${IMAGE}:devel-${ARCH}"
          docker run --rm --platform "linux/${ARCH}" "${IMAGE}:devel-${ARCH}" \
            /bin/bash -lc 'test -x /bin/bash && test -d /usr/bin'

  publish:
    needs: build
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-arch tags
        run: |
          set -euo pipefail

          for variant in standard devel distroless; do
            docker buildx imagetools inspect "${IMAGE}:${variant}-amd64"
            docker buildx imagetools inspect "${IMAGE}:${variant}-arm64"

            docker buildx imagetools create \
              --tag "${IMAGE}:${variant}" \
              "${IMAGE}:${variant}-amd64" \
              "${IMAGE}:${variant}-arm64"
          done

          docker buildx imagetools create \
            --tag "${IMAGE}:latest" \
            "${IMAGE}:standard-amd64" \
            "${IMAGE}:standard-arm64"

      - name: Create date tag and GitHub Release with image archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name "gt-ayush"
          git config user.email "206460708+gt-ayush@users.noreply.github.com"

          # Fetch tags first so the check below actually knows about remote tags
          git fetch --force --tags origin

          TAG="v$(date -u +%Y.%m.%d)"
          mkdir -p release-assets

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Release tag ${TAG} already exists; skipping date tag, archives, and release creation."
            exit 0
          fi

          git tag -a "${TAG}" -m "BlackArch image sync ${TAG}"
          git push origin "refs/tags/${TAG}"

          for arch in amd64 arm64; do
            for variant in standard devel distroless; do
              IMAGE_TAG="${IMAGE}:${variant}-${arch}"
              ARCHIVE="release-assets/blackarch-${variant}-${arch}-${TAG}.tar.gz"

              echo "Pulling ${IMAGE_TAG}"
              docker pull --platform "linux/${arch}" "${IMAGE_TAG}"

              echo "Saving ${IMAGE_TAG} to ${ARCHIVE}"
              docker save "${IMAGE_TAG}" | gzip -1 > "${ARCHIVE}"
            done
          done

          gh release create "${TAG}" release-assets/*.tar.gz \
            --title "BlackArch ${TAG}" \
            --notes "$(printf 'Automated BlackArch container image sync.\n\nSource commit: %s\nPublished images: ghcr.io/gt-ayush/blackarch\nArchitectures: linux/amd64, linux/arm64\nVariants: standard, devel, distroless' "${GITHUB_SHA}")"
